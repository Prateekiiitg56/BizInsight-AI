name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NLTK_DATA: /tmp/nltk_data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # The test suite doesn't exercise the torch-based clustering pipeline, so skip
      # the heavy ML packages to keep CI fast.
      - name: Install dependencies
        run: |
          grep -vE "extra-index-url|^torch|sentence-transformers|bertopic|hdbscan|umap-learn|langchain-huggingface" requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt pytest httpx
          python -c "import nltk; nltk.download('vader_lexicon', download_dir='/tmp/nltk_data')"
      - run: python -m pytest -q tests
